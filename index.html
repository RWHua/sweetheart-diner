  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace']

            ink:    '#0a0a0a',

            warm:   '#b8956a',
            tx:     '#e0e0e0',
            mute:   '#888',

          },
          animation: {
            'modal-in': 'modalIn .24s ease-out both',
            'pulse-glow': 'pulseGlow 2s ease-in-out infinite'
          },
          keyframes: {
            modalIn: {
              from: { opacity: '0', transform: 'translateY(18px)' },
              to:   { opacity: '1', transform: 'translateY(0)' }

            pulseGlow: {
              '0%,100%': { boxShadow: '0 0 6px rgba(138,180,248,.2)' },
              '50%':     { boxShadow: '0 0 18px rgba(138,180,248,.5)' }

  <!-- ====== 菜单页 ====== -->
  <div id="menuPage" class="hidden min-h-screen"></div>

  <!-- ====== 顶部标题栏 ====== -->

    <div class="max-w-[430px] mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">

    </div>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    const menuList = [
      { id:'guobaorou',  category:'东北菜', name:'锅包肉',       price:0, desc:'酸甜酥脆，咬一口就是家乡味。',    img:'./images/guobaorou.jpg',  ingredients:'精选里脊、米醋、白糖、胡萝卜丝与葱姜。',              detail:'外酥里嫩的经典东北菜，酸甜口感像我们第一次约会时的心情。',            nutrition:'碳水 42% · 蛋白质 28% · 脂肪 30%', taste:5.0, selectedCount:0, steps:['里脊肉切薄片，加料酒、盐腌制15分钟。','土豆淀粉加水调成糊，肉片裹糊。','油温七成热下锅炸至金黄捞出。','另起锅，糖醋汁翻炒至浓稠，下肉片快速翻匀出锅。'], tips:'糖醋比例 3:2 最佳，炸两次更酥脆。' },
      { id:'mapotofu',   category:'川菜',   name:'麻婆豆腐',     price:0, desc:'麻辣鲜香，软嫩豆腐超下饭。',      img:'./images/mapotofu.jpg',   ingredients:'嫩豆腐、牛肉末、郫县豆瓣、花椒与小葱。',                 detail:'一勺热乎乎的豆腐，带来刚刚好的麻辣和满满的满足感。',              nutrition:'碳水 18% · 蛋白质 34% · 脂肪 48%', taste:4.8, selectedCount:0, steps:['嫩豆腐切2cm方块，焯水去腥。','牛肉末炒至变色，加郫县豆瓣炒出红油。','加高汤煮沸，下豆腐小火煮5分钟。','勾芡收汁，撒花椒面和小葱出锅。'], tips:'豆腐不要翻动太猛，轻轻推即可保持完整。' },

      { id:'shuizhuyu',   category:'川菜',  name:'水煮鱼',       price:0, desc:'满盆红油辣子滚，鱼片嫩滑一口销魂。',    img:'./images/shuizhuyu.jpg',    ingredients:'黑鱼片、郫县豆瓣酱、干辣椒、花椒、金针菇、豆芽、蒜末。', detail:'热油泼在蒜末辣椒上滋啦一声响，鱼片嫩到筷子夹不住，红油滚滚麻辣鲜香，是川菜里最霸道的那一碗。', nutrition:'碳水 10% · 蛋白质 52% · 脂肪 38%', taste:5.0, selectedCount:0, steps:['黑鱼片加淀粉、盐、白胡椒粉腌制20分钟。','葱姜蒜炒香，加2勺郫县豆瓣酱炒出红油。','倒2碗水煮开，加1勺生抽、1勺蚝油、1勺白糖。','配菜煮熟捞出铺碗底，下鱼片煮1分钟，连汤带肉倒入碗中。','撒上蒜末、辣椒粉、干辣椒段、青椒圈。','热油炸花椒粒，泼在鱼肉上激出香味。'], tips:'鱼片下锅只煮1分钟，久了就老了，嫩滑是灵魂。' },
      { id:'shuizhufn',   category:'川菜',  name:'水煮肥牛',     price:0, desc:'红油翻滚肥牛嫩，一勺热油滋啦魂。',      img:'./images/shuizhufn.jpg',    ingredients:'肥牛片、豆芽、千张丝、郫县豆瓣酱、火锅底料、辣椒面、花椒、葱花。', detail:'薄嫩肥牛在红油里打了个滚，铺在脆爽豆芽上，热油泼下滋啦一声，麻辣鲜香直冲天灵盖。', nutrition:'碳水 12% · 蛋白质 45% · 脂肪 43%', taste:4.3, selectedCount:0, steps:['肥牛焯熟捞出备用。','豆芽、千张丝焯出沥干。','葱姜蒜爆香，加1勺豆瓣酱和半块火锅底料炒化。','倒一碗清水煮开，加2勺生抽1勺老抽和少许鸡精盐。','下豆芽千张丝煮熟捞出铺碗底。','下肥牛煮入味，捞出铺在配菜上。','撒辣椒面、花椒、葱花。','热油泼上激出香味。'], tips:'肥牛焯水不超过20秒，变色就捞出，久了会老。' },
      { id:'jiaoyantudou',category:'家常菜',name:'椒盐土豆片',   price:0, desc:'外焦里糯椒盐香，黑芝麻点睛一口脆。',      img:'./images/jiaoyantudou.jpg', ingredients:'土豆、椒盐粉、黑芝麻、食用油。',                                 detail:'每一片煎到金黄起焦，椒盐咸香钻进软糯土豆芯，黑芝麻的坚果香在齿间炸开，简单却停不下来。', nutrition:'碳水 75% · 蛋白质 8% · 脂肪 17%', taste:2.3, selectedCount:0, steps:['土豆去皮切薄片洗净。','水开上锅蒸10分钟。','油热下锅煎至两面金黄起焦。','加1勺椒盐粉翻炒均匀。','撒黑芝麻出锅。'], tips:'土豆片蒸过再煎，外焦里糯的关键就是这一步。' },
      { id:'zhaxingbaogu',category:'家常菜',name:'炸杏鲍菇',     price:0, desc:'外酥里嫩会爆汁，比小酥肉还上瘾。',      img:'./images/zhaxingbaogu.jpg', ingredients:'杏鲍菇、淀粉、鸡蛋、椒盐、辣椒粉、食用油。',                     detail:'金黄酥壳咬开是滚烫的菇汁，椒盐的咸香裹着辣椒的微辣，外脆里嫩一口一个，夜市排队都不如自己炸。', nutrition:'碳水 30% · 蛋白质 12% · 脂肪 58%', taste:3.4, selectedCount:0, steps:['杏鲍菇切条状。','3勺淀粉+2个鸡蛋搅成糊状，加适量椒盐拌匀。','杏鲍菇均匀裹上面糊。','油烧至六成热（160°C），中小火下锅炸2-3分钟至微黄捞出。','油温升至八成热（180°C），大火复炸30秒至金黄酥脆。','捞出沥油，撒辣椒粉即可。'], tips:'复炸是酥脆的关键——第一次炸熟，第二次高温抢酥，少一步都不脆。' },
      { id:'dapaofan',    category:'泰式料理',name:'泰式猪肉打抛饭',price:0, desc:'鱼露咸香九层塔，戳破蛋液拌饭魂。',    img:'./images/dapaofan.jpg',     ingredients:'猪肉末220g、长豆角80g、九层塔20g、蒜末、小米辣、鸡蛋、米饭。',  detail:'鱼露的鲜撞上九层塔的辛香，肉末裹着酱汁铺满米饭，戳破溏心蛋拌匀，每一粒米都吸饱了咸辣浓汁。', nutrition:'碳水 40% · 蛋白质 30% · 脂肪 30%', taste:4.1, selectedCount:0, steps:['长豆角切小粒，小米辣切圈，九层塔摘叶。','锅中倒油打入鸡蛋，小火煎1分钟成太阳蛋盛出。','锅中留油，蒜末小米辣炒香15秒。','下猪肉末中火炒1分30秒至变色松散。','加豆角和调味汁（鱼露10g+生抽8g+蚝油8g+老抽2g+糖4g+水30g）炒1分钟。','关火放九层塔翻拌15秒，盖在米饭上配太阳蛋。'], tips:'九层塔一定关火后再放，余温烫一下出香，炒久了会苦。' },
      { id:'roumodoufu',  category:'川菜',  name:'肉沫豆腐',     price:0, desc:'酱汁浓郁拌饭神器。',                    img:'./images/roumodoufu.jpg',  ingredients:'嫩豆腐、猪肉末、蒜、葱花。',                               detail:'豆腐嫩滑吸饱肉汁，舀一勺浇在饭上，三碗打底～',                  nutrition:'碳水 18% · 蛋白质 30% · 脂肪 52%', taste:3.8, selectedCount:0, steps:['豆腐切2cm方块，沸水焯2分钟捞出沥干（去豆腥，不易碎）。','肉末加1勺料酒、1勺生抽、半勺淀粉抓匀，腌制10分钟。','调酱汁：2勺生抽、半勺老抽、1勺蚝油、半勺糖、3勺清水搅匀。','中火热锅，油温六成（约160°C），下蒜末爆香10秒。','倒入肉末，中火炒散至变色（约2分钟）。','加入豆腐丁轻轻推匀，沿锅边淋入酱汁。','转小火焖煮3分钟入味。','淋水淀粉勾芡，大火收汁30秒至浓稠。','撒葱花翻匀出锅。'], tips:'嫩豆腐口感更滑，焯水后不易碎；收汁时轻推勿翻，保持豆腐完整。' },
      { id:'doujiaochaoroumo',category:'家常菜',name:'豆角炒肉沫',   price:0, desc:'豆角脆嫩肉末酱香，拌饭一绝。',            img:'./images/doujiaochaoroumo.jpg', ingredients:'豆角、猪肉末、蒜、生抽、蚝油。',                             detail:'翠绿豆角挂满酱香肉末，舀一勺浇在热米饭上，汤汁都能拌三碗～',    nutrition:'碳水 22% · 蛋白质 28% · 脂肪 50%', taste:3.6, selectedCount:0, steps:['豆角洗净切小丁，蒜切末。','调酱汁：2勺生抽、1勺蚝油、半勺白糖、少许老抽、1勺料酒搅匀。','中火热锅倒油，油温六成（约160°C），下肉末中火炒至变色散开（约2分钟）。','倒入酱汁翻炒均匀，盛出备用。','锅中留底油，下蒜末小火煸香10秒。','倒入豆角丁，中大火翻炒3-4分钟至断生变软。','倒回肉末，大火翻炒1分钟让酱汁均匀包裹。','出锅装盘。'], tips:'豆角一定要炒熟透（生的有毒），不确定的话先焯水1分钟再炒更安全。' },
      { id:'galijituitudou',category:'家常菜',name:'咖喱鸡腿土豆',   price:0, desc:'金黄咖喱浓汁裹饭，一口暖到心底。',        img:'./images/galijituitudou.jpg', ingredients:'鸡腿肉、土豆、胡萝卜、洋葱、彩椒、咖喱块。',                 detail:'鸡腿肉嫩滑，土豆胡萝卜软糯，金黄咖喱汁浇在热米饭上，每一粒米都裹满浓香～', nutrition:'碳水 35% · 蛋白质 32% · 脂肪 33%', taste:4.1, selectedCount:0, steps:['鸡腿去骨切块，加料酒、生抽、玉米淀粉各1勺，抓匀腌制10分钟。','洋葱、彩椒、胡萝卜、土豆切丁备用。','中火热锅倒油，油温六成（约160°C），下鸡肉中火炒至变色熟透（约2-3分钟），盛出。','锅中留底油，下洋葱、彩椒、胡萝卜、土豆丁，中火翻炒2分钟出香。','倒回鸡肉，加少许盐、1勺生抽，翻炒均匀入味。','加清水没过食材，大火烧开转中火煮10分钟。','加入咖喱块搅拌至融化，转小火再煮5分钟。','煮至汤汁浓稠即可，浇在米饭上开吃。'], tips:'咖喱块最后放，小火慢煮才不会糊底；隔夜咖喱更入味。' },
      { id:'zhaoshaofeiniu',category:'家常菜',name:'照烧肥牛',     price:0, desc:'酱汁浓郁肥牛嫩滑，戳破溏心蛋拌饭。',      img:'./images/zhaoshaofeiniu.jpg', ingredients:'肥牛卷、洋葱、鸡蛋、生抽、蚝油、芝麻。',                       detail:'肥牛片裹满照烧酱汁，戳破溏心蛋拌匀，每一粒米都闪着光～',        nutrition:'碳水 28% · 蛋白质 35% · 脂肪 37%', taste:3.9, selectedCount:0, steps:['肥牛卷沸水焯至变色（约30秒），捞出沥干。','洋葱切丝，中火热锅倒油，油温六成（约160°C），下洋葱中火翻炒2分钟至变软透明。','调照烧汁：2勺生抽、1勺蚝油、1勺老抽、1勺白糖搅匀。','放入焯好的肥牛，倒入照烧汁，中火翻炒均匀（约1分钟）。','1勺淀粉加半碗清水搅匀，淋入锅中勾芡，煮至汤汁浓稠。','另起锅小火煎两个溏心荷包蛋（蛋白凝固、蛋黄流动）。','米饭盛入碗中，铺上照烧肥牛，摆上溏心蛋，撒黑白芝麻。'], tips:'肥牛焯水不超过30秒，久了会老；溏心蛋是灵魂，戳破拌饭味道翻倍。' },
      { id:'shouzhuabinghuotui',category:'家常菜',name:'手抓饼卷火腿肠', price:0, desc:'层层酥脆，一口一个停不下来。',          img:'./images/shouzhuabinghuotui.jpg', ingredients:'手抓饼皮、火腿肠、鸡蛋、黑芝麻。',                       detail:'手抓饼裹着火腿肠烤到金黄酥脆，刷上蛋液撒满芝麻，简单到新手也能轻松拿捏～', nutrition:'碳水 45% · 蛋白质 18% · 脂肪 37%', taste:3.1, selectedCount:0, steps:['火腿肠切成小段（约4cm）。','手抓饼皮均匀切成三角形或长条。','将火腿肠段放在饼皮宽端，卷起来包好。','烤盘铺油纸，卷好的火腿肠卷依次摆好。','表面刷一层蛋液，撒上黑芝麻。','烤箱预热180°C，中层烤15分钟至表面金黄酥脆。','出锅趁热吃。'], tips:'手抓饼皮不用解冻太久，微软即可操作；烤到表面金黄立刻出炉，过久会干。' },
      { id:'lazijiding',  category:'川菜',  name:'辣子鸡丁',     price:0, desc:'辣椒里找鸡丁，越辣越停不下来。',          img:'./images/lazijiding.jpg',  ingredients:'鸡腿肉、干辣椒、花椒、蒜、葱、青椒。',                     detail:'鸡丁炸到金黄酥脆，埋在一堆干辣椒里，翻出一块就着花椒麻香，越吃越上瘾～', nutrition:'碳水 10% · 蛋白质 45% · 脂肪 45%', taste:4.3, selectedCount:0, steps:['鸡腿去骨切丁，加葱姜、1勺蚝油、1勺料酒、2勺生抽、1勺淀粉、黑胡椒粉、少许盐，抓匀腌制20分钟。','油温六成（约160°C），下鸡丁中火炸3-4分钟至金黄捞出。','油温升至八成（约180°C），复炸30秒至酥脆，捞出沥油。','锅中留底油，小火下蒜末、干辣椒段、花椒粒炒香（约30秒）。','倒入炸好的鸡丁和青椒片，大火快速翻炒1分钟。','下葱段翻匀，出锅装盘。'], tips:'干辣椒量要比鸡丁多才正宗——在辣椒里找肉吃才是辣子鸡丁的灵魂。' },
      { id:'keletudounijitui',category:'家常菜',name:'可乐土豆泥鸡腿饭', price:0, desc:'可乐炖出焦糖光，土豆泥拌饭香迷糊。',    img:'./images/keletudounijitui.jpg', ingredients:'鸡腿、土豆、可乐、生抽、老抽、蚝油、芝麻。',                 detail:'可乐炖出的琥珀色酱汁裹满鸡腿，一半土豆碾成泥融进汤汁，拌上热米饭香到迷糊～', nutrition:'碳水 38% · 蛋白质 28% · 脂肪 34%', taste:3.8, selectedCount:0, steps:['鸡腿去骨切块，加1勺老抽、2勺生抽、1勺蚝油、1勺料酒抓匀，腌制20分钟。','土豆去皮切大块备用。','中火热锅倒油，鸡皮朝下中火煎3分钟至金黄，翻面炒至变色。','加入土豆块翻炒2分钟。','调汁：1勺老抽、2勺生抽、1勺蚝油、1勺淀粉、少许水搅匀。','倒入料汁和1罐可乐（约330ml），大火烧开。','转小火盖盖焖15分钟至土豆软烂。','取一半土豆用勺子碾碎成泥拌入汤汁，大火收汁至浓稠。','出锅盛在米饭上，撒白芝麻。'], tips:'一半土豆碾成泥是灵魂——让汤汁变浓稠裹满每粒米；可乐选普通版，无糖版不出焦糖色。' },
      { id:'fanqiexiarenyimian',category:'家常菜',name:'番茄虾仁意面',   price:0, desc:'酸甜浓郁芝士拉丝，虾仁弹嫩意面爽滑。',    img:'./images/fanqiexiarenyimian.jpg', ingredients:'意面、虾仁、番茄、洋葱、芝士、番茄酱。',                   detail:'番茄炒出沙裹满每一根意面，芝士融化拉丝，虾仁弹牙——她爱吃我就学会了～', nutrition:'碳水 52% · 蛋白质 28% · 脂肪 20%', taste:3.9, selectedCount:0, steps:['意面沸水加盐煮8-10分钟至弹牙，捞出过凉水沥干。','虾仁去虾线，加少许料酒、盐腌5分钟。','番茄去皮切丁，洋葱切碎。','中火热锅倒油，下洋葱碎炒香，加虾仁炒至变色盛出。','锅中加油，下番茄丁中火炒出沙（约3分钟），加2勺番茄酱翻匀。','加2勺生抽、1勺蚝油、少许胡椒粉、半勺白糖调味。','放入一片芝士，小火搅拌至融化。','倒入煮好的意面和虾仁，大火翻炒1分钟让酱汁均匀裹上面条。','出锅装盘。'], tips:'番茄一定要炒出沙才够浓郁；芝士最后放趁热吃，凉了就不拉丝了。' },
      { id:'cuipijiaoyanchichi',category:'家常菜',name:'脆皮椒盐鸡翅玉米', price:0, desc:'鸡翅酥脆椒盐香，玉米爆汁嘎嘎好吃。',    img:'./images/cuipijiaoyanchichi.jpg', ingredients:'鸡翅、玉米、鸡蛋、辣椒粉、孜然粉、椒盐。',                 detail:'鸡翅炸到脆皮金黄，玉米段刷满椒盐辣油，一口鸡翅一口玉米嘎嘎香～',  nutrition:'碳水 25% · 蛋白质 35% · 脂肪 40%', taste:4.2, selectedCount:0, steps:['鸡翅洗净对半切开，加1勺料酒、1勺生抽、少许盐、1个鸡蛋抓匀，腌制20分钟。','调椒盐辣油：2勺辣椒粉、1勺孜然粉、半勺椒盐、3勺热油搅匀。','玉米切成短圆柱段，均匀刷上椒盐辣油。','油温六成（约160°C），下鸡翅中火炸5分钟至金黄捞出。','油温升至八成（约180°C），鸡翅复炸30秒至脆皮，玉米段炸2分钟。','捞出沥油，撒椒盐粉翻匀装盘。'], tips:'鸡翅对半切开更容易炸透；复炸是脆皮的关键，不能省。' },
      { id:'boluoheijiaoniurou',category:'家常菜',name:'菠萝黑椒牛肉',   price:0, desc:'菠萝酸甜撞黑椒辛香，牛肉嫩滑一口入魂。',  img:'./images/boluoheijiaoniurou.jpg', ingredients:'牛肉、菠萝、生抽、陈醋、蚝油、黑胡椒、欧芹。',                 detail:'牛肉煎到焦香，菠萝酸甜爆汁，黑椒的辛香把两种味道完美串在一起，香喷喷～', nutrition:'碳水 20% · 蛋白质 42% · 脂肪 38%', taste:4.4, selectedCount:0, steps:['菠萝去皮切丁，用盐水浸泡5分钟去涩。','牛肉切丁，加1勺生抽、1勺陈醋、1勺蚝油、1勺淀粉、少许盐和黑胡椒粉，抓匀腌制20分钟。','中火热锅少油，油温六成（约160°C），下牛肉丁中火煎至表面金黄（约3分钟）。','倒入菠萝丁，大火翻炒1-2分钟至菠萝微微出汁。','撒欧芹碎翻匀出锅。'], tips:'菠萝泡盐水去涩味，炒的时候大火快炒保留汁水；牛肉不要煎太久，嫩滑才好吃。' },
      { id:'suancaiyu',   category:'川菜',  name:'酸菜鱼',       price:0, desc:'鱼片嫩滑酸汤开胃，筷子都夹不住。',          img:'./images/suancaiyu.jpg',   ingredients:'鱼片、酸菜、泡椒、干辣椒、花椒、金针菇、豆芽。',           detail:'鱼片嫩到筷子夹不住，酸菜发酵出的鲜酸撞上热油泼出的辣椒香，一口下去夏天厌食症都治好了～', nutrition:'碳水 12% · 蛋白质 48% · 脂肪 40%', taste:5.0, selectedCount:0, steps:['鱼片加姜葱、1勺红薯淀粉、少许鸡精、盐、白胡椒粉抓匀，腌制10分钟。鱼骨同样加姜葱盐腌10分钟。','金针菇、豆芽沸水加盐焯熟，捞出铺碗底。','酸菜切段，泡姜泡椒切碎，蒜切末。','中火热锅多油，下酸菜、泡姜、泡椒、蒜末，小火炒干水分炒出香味（约3分钟）。','加足量开水，加鸡精、白胡椒粉调味，尝咸淡补盐。','下鱼骨中火煮3分钟至熟，捞出铺在菜上。','转小火，鱼片一片片下锅，轻轻拨散，煮约1分钟至变白立刻捞出铺碗中。','浇入汤汁，撒上干辣椒段、蒜末、花椒、白芝麻、葱花、香菜。','另起锅烧热油（约180°C），泼在香料上激出滋啦一声。'], tips:'鱼片下锅只煮1分钟，变白就捞，久了就老了；热油泼香料是灵魂一步，不能省。' },
      { id:'shutiao',     category:'家常菜',name:'薯条',         price:0, desc:'外脆里糯黑椒香，蘸上番茄酱绝了。',          img:'./images/shutiao.jpg',     ingredients:'土豆、盐、黑胡椒、番茄酱。',                                 detail:'空气炸锅搞定的脆薯条，黑胡椒提味，蘸上番茄酱一口一根根本停不下来～', nutrition:'碳水 72% · 蛋白质 5% · 脂肪 23%', taste:3.3, selectedCount:0, steps:['土豆去皮切粗条（约1cm宽）。','清水浸泡10分钟洗去表面淀粉。','水烧开下薯条煮3分钟，捞出沥干水分。','加适量盐和黑胡椒粉拌匀调味。','空气炸锅180°C烤15分钟。','翻面再烤10分钟至金黄酥脆出锅。','蘸番茄酱开吃。'], tips:'泡水去淀粉是关键，不然不脆；粗细要均匀，不然烤的不一致。' },
      { id:'fengmihuangyoucuipijipai',category:'韩式料理',name:'蜂蜜黄油脆皮鸡排', price:0, desc:'脆壳裹着蜂蜜黄油，一口爆汁甜咸交织。',  img:'./images/fengmihuangyoucuipijipai.jpg', ingredients:'鸡腿、黄油、蜂蜜、蒜、生抽、蚝油、黑胡椒。',           detail:'鸡排煎到金黄酥脆，黄油和蜂蜜熬成的酱汁裹满脆壳，切成条咬开里面嫩到爆汁～', nutrition:'碳水 15% · 蛋白质 42% · 脂肪 43%', taste:4.7, selectedCount:0, steps:['鸡腿去骨，加姜蒜片、2勺蚝油、2勺生抽、少许盐和黑胡椒粉，抓匀腌制30分钟。','腌好的鸡排两面均匀裹上一层薄淀粉。','中火热锅倒油，油温六成（约160°C），下鸡排中火煎至两面金黄熟透（每面约3-4分钟），盛出。','另起锅放入一小块黄油，小火融化。','下蒜末炒香，加1勺生抽、1勺蜂蜜搅拌均匀。','倒回鸡排，均匀裹上酱汁，大火收汁30秒。','出锅切条装盘。'], tips:'裹淀粉要薄而均匀，太厚影响脆度；蜂蜜最后放，高温久煮会发苦。' },
      { id:'xianxiamangguoshousita',category:'日式料理',name:'鲜虾芒果寿司塔', price:0, desc:'海苔脆壳裹满鲜虾芒果，一口层次爆炸。',  img:'./images/xianxiamangguoshousita.jpg', ingredients:'米饭、海苔、虾仁、芒果、牛油果、鱼籽、沙拉酱、黄芥末。',   detail:'海苔烤到酥脆作响，芝麻盐米饭垫底，鲜虾沙拉堆成塔，芒果牛油果和爆珠鱼籽铺满顶层，一口咬下脆软酸甜咸全在嘴里炸开～', nutrition:'碳水 48% · 蛋白质 22% · 脂肪 30%', taste:4.3, selectedCount:0, steps:['米饭趁热拌入芝麻盐，放凉备用。','虾仁切小块，加1大勺沙拉酱、1勺黄芥末、1勺蚝油、1勺生抽、鱼籽和少许芥末籽拌匀。','海苔剪成4等份，每份铺上一层芝麻盐米饭。','将饭团放入纸杯模具，顶部放上调好的虾仁沙拉。','烤箱/空气炸锅180°C烤10分钟，底部湿润边缘酥脆。','取出脱模，挤上沙拉酱+番茄酱+黄芥末混合酱。','顶部放芒果丁、牛油果丁、鱼籽、芝士碎、葱花装饰。'], tips:'海苔烤到边缘脆即可，过久会焦苦；芒果选熟透的才够甜，和咸鲜虾肉形成完美反差。' },
      { id:'nailaozhazhupai',category:'日式料理',name:'奶酪炸猪排',     price:0, desc:'流心奶酪裹酥脆猪排，拉丝比初恋还长。',          img:'./images/nailaozhazhupai.jpg', ingredients:'猪里脊、奶酪、面包糠、鸡蛋、面粉。',                         detail:'金黄酥壳咬开是滚烫的芝士瀑布，外脆里嫩还会拉丝，比初恋还让人心跳加速～', nutrition:'碳水 25% · 蛋白质 38% · 脂肪 37%', taste:4.6, selectedCount:0, steps:['猪里脊切1cm厚片，用肉锤敲薄至5mm，两面撒盐和黑胡椒腌制15分钟。','奶酪切成和猪排大小匹配的薄片，两片猪排夹入奶酪，边缘用力压紧封口。','依次裹上薄面粉→蘸蛋液→压满面包糠，用手压实防止炸时脱落。','油温烧至160°C，中火炸3-4分钟至表面金黄捞出沥油。','油温升至180°C，大火复炸30秒至酥脆，外皮呈深金色立刻出锅。','趁热切条装盘，芝士拉丝趁热吃。'], tips:'猪排边缘一定要压紧封口，否则炸的时候芝士会漏出来；复炸30秒是酥脆拉丝的关键，不能省。' },
      { id:'dikamochaputao',category:'饮品',name:'低卡抹茶葡萄奶',   price:0, desc:'三层渐变抹茶葡萄奶，搅匀喝超治愈。',        img:'./images/dikamochaputao.jpg', ingredients:'冰块、葡萄汁、牛奶、抹茶粉。',                               detail:'底层紫葡萄汁的酸甜撞上顶层抹茶的微苦，牛奶在中间画出一道柔和渐变线——搅匀喝是治愈浅绿色，分层喝三种味道轮番登场～', nutrition:'碳水 65% · 蛋白质 12% · 脂肪 23%', taste:3.3, selectedCount:0, steps:['杯底加满冰块，倒入150ml冰葡萄汁打底。','沿杯壁缓慢倒入150ml冰牛奶，形成白紫分层。','取5g抹茶粉用少许热水打发至无颗粒，缓缓倒在顶部。'], tips:'葡萄汁要冰的才分层明显；牛奶沿杯壁慢倒，急倒会浑浊。抹茶提前用茶筅打发更细腻。' },
      { id:'disanxian',   category:'东北菜',name:'地三鲜',         price:0, desc:'三样过油咸香下饭，酱汁拌饭一绝。',        img:'./images/disanxian.jpg',     ingredients:'茄子、土豆、青椒、蒜。',                                     detail:'土豆炸到外焦里糯，茄子吸饱酱汁软乎乎，青椒还带着脆劲，一勺扣进米饭里酱汁直往下渗，两个人抢着吃才香～', nutrition:'碳水 40% · 蛋白质 8% · 脂肪 52%', taste:3.8, selectedCount:0, steps:['土豆去皮切滚刀块，茄子带皮切滚刀块，青椒去籽切块；茄子块撒少许淀粉拌匀，减少吸油。','调碗汁：2勺生抽、1勺老抽、1勺蚝油、1勺白糖、1勺淀粉、半碗清水搅匀。','锅中倒宽油，烧至六成热（约170°C，筷子插入冒小泡），下土豆块小火炸5-8分钟至金黄、筷子能轻松扎透，捞出控油。','下茄子块，中火炸约3分钟至表面金黄变软，捞出控油。','下青椒块过油30秒-1分钟，表皮微皱立刻捞出。','锅留底油，下蒜末爆香，倒入三种炸好的食材，倒入碗汁，大火翻炒至酱汁均匀裹上。','大火收汁至浓稠，装盘开吃。'], tips:'茄子裹淀粉再炸，酥脆还少吸油；土豆要炸透才外焦里糯；青椒过油时间要短，久了发软变色。碗汁提前调好，下锅大火快炒，慢了茄子就塌了。' },
      { id:'ningmengfengmijichi', category:'家常菜',name:'柠檬蜂蜜鸡翅', price:0, desc:'蜜汁裹柠檬香，空气炸锅零失败。',   img:'./images/ningmengfengmijichi.jpg', ingredients:'鸡翅、柠檬、生抽、蜂蜜、老抽、蚝油、盐、白胡椒粉。',    detail:'金黄焦糖壳裹着嫩鸡翅，柠檬片垫底清香解腻，酸甜咸香一口咬下去汁水在嘴里炸开，配剧配饭都绝了～', nutrition:'碳水 12% · 蛋白质 46% · 脂肪 42%', taste:3.5, selectedCount:0, steps:['鸡翅洗净沥干，两面各划两刀改花刀。','柠檬切片去籽备用（去籽防烤后发苦）。','鸡翅加生抽2勺、蜂蜜2勺、老抽1勺、蚝油1勺、盐4克、白胡椒粉1勺，充分抓匀腌制30分钟。','空气炸锅铺柠檬片垫底，鸡翅平铺在柠檬片上。','200°C烤15分钟，翻面再烤10分钟，出炉开吃。'], tips:'柠檬片一定要去籽，不然烤完发苦；中途翻面受热均匀，避免烤过头。1900W以上大功率炸锅可降档：180°C烤10分钟翻面5分钟；怕颜色太深就160°C各烤10分钟。腌制2小时以上更入味。' },
      { id:'hongchazhitaozi', category:'甜品',name:'红茶渍桃子',     price:0, desc:'茶香蜜渍桃肉，冷藏后更清甜。',        img:'./images/hongchazhitaozi.jpg', ingredients:'桃子、百香果、青柠、蜂蜜、伯爵红茶粉、酸奶球、薄荷。',  detail:'桃子吸饱了红茶蜂蜜的酸甜汁水，一口下去冰凉带茶香，配上酸奶球和薄荷，清爽得像是把整个夏天装进了碗里～', nutrition:'碳水 85% · 蛋白质 3% · 脂肪 12%', taste:3.1, selectedCount:0, steps:['桃子洗净去皮，切成月牙块，放入碗中备用。','挤入半个青柠的汁，立刻翻拌，防止氧化变色。','百香果对半切开，挖出果肉和果汁，全部倒入桃子碗中。','淋入2勺蜂蜜，撒半小勺伯爵红茶粉，轻轻拌匀。','盖保鲜膜，放入冰箱冷藏1小时，让桃子慢慢释放吸收汁水。','取出连汁装盘，中间放一个酸奶球，点缀薄荷叶。'], tips:'青柠汁要立刻拌匀防氧化，晚了桃子变褐；伯爵红茶粉半小勺就够，多了发涩；冷藏1小时是入味关键，别省。酸奶球可以换成香草冰淇淋，一样好吃。' },
      { id:'luoshenmeiguobingcha', category:'饮品',name:'洛神莓果冰茶', price:0, desc:'莓果酸甜洛神香，冰爽通透超好喝。',  img:'./images/luoshenmeiguobingcha.jpg', ingredients:'草莓、蓝莓、洛神花、蜂蜜、冰块、迷迭香。',                 detail:'深红洛神茶汤撞上捣碎的草莓蓝莓，酸酸甜甜带着花香，满杯冰块一口下去透心凉，夏夜配剧的完美搭子～', nutrition:'碳水 90% · 蛋白质 2% · 脂肪 8%', taste:3.6, selectedCount:0, steps:['洛神花3朵放入壶中，倒入500ml开水，泡至茶汤变深红色（约5-8分钟）。','草莓去蒂放入杯底，用捣棒捣碎成泥，加1勺蜂蜜拌匀。','杯中加入满杯冰块，蓝莓粒穿插在冰块间。','洛神茶汤稍放凉，沿杯壁缓缓倒入杯中，形成红宝石色分层。','顶部放草莓片、蓝莓和迷迭香装饰，完成。'], tips:'草莓捣细一点果香更足；洛神茶偏酸，按口味可多加蜂蜜；茶汤要放凉一点再倒，太热会化掉冰块冲乱分层。' },
      { id:'taishicuipiji', category:'泰式料理',name:'泰式脆皮鸡',   price:0, desc:'外脆里嫩蘸甜辣汁，一口起飞。',     img:'./images/taishicuipiji.jpg',   ingredients:'鸡腿、洋葱、香菜、蒜、白胡椒、淀粉、泰式甜辣酱、鱼露、青柠汁、小米辣。', detail:'鸡皮煎到琥珀色咔咔脆，肉嫩到爆汁，裹满泰式甜辣蘸料，酸甜辣一起涌上来，筷子根本停不下来～', nutrition:'碳水 22% · 蛋白质 36% · 脂肪 42%', taste:4.0, selectedCount:0, steps:['鸡腿去骨，加洋葱丝、香菜、蒜末、白胡椒粉和少许盐，抓匀腌制30分钟。','腌好的鸡腿两面均匀裹满淀粉，用手压实。','平底锅倒稍多的油，油温烧至六成热（约170°C，筷子插入冒小泡）。','鸡皮朝下先下锅，中小火煎至定型不翻动（约6-8分钟）。','翻面再煎6-8分钟，两面金黄、筷子戳肉爆汁即熟，捞出沥油。','切成喜欢的大小，蘸泰式甜辣汁（甜辣酱+鱼露+青柠汁+小米辣+香菜+蒜末+糖）开吃。'], tips:'鸡皮朝下先定型再翻面，中小火慢煎防外糊里生；裹粉压实才够脆；蘸料现调现吃，鱼露提鲜、青柠汁解腻，酸甜辣自己调。' },
      { id:'taishizhujingrou', category:'泰式料理',name:'泰式猪颈肉',   price:0, desc:'焦糖蜜汁嫩肉，蘸酸辣汁绝了。',     img:'./images/taishizhujingrou.jpg', ingredients:'松板肉（猪颈肉）、香菜根、香葱、蒜、老抽、生抽、鱼露、蚝油、糖、青柠。', detail:'烤到边缘焦糖化，咬开里面还是嫩粉色，油脂在嘴里化开，卷上生菜蘸一口酸辣汁，甜咸酸辣全在嘴里开会～', nutrition:'碳水 12% · 蛋白质 34% · 脂肪 54%', taste:3.5, selectedCount:0, steps:['松板肉200g洗净擦干水分，香菜根、香葱、蒜切末。','加入老抽半勺、生抽2勺、鱼露2勺、蚝油1勺、糖2勺，抓匀腌制4小时以上（隔夜更入味）。','空气炸锅180°C预热5分钟，放入腌好的松板肉。','180°C烤10分钟，翻面再烤10分钟（共20分钟），烤至表面焦糖色。','取出静置5分钟锁汁，逆纹切成薄片。','配生菜、番茄和蘸水（青柠+小米辣+香菜+鱼露）装盘开吃。'], tips:'腌制至少4小时、隔夜更入味，这是灵魂；中途翻面受热均匀；烤完静置5分钟再切，肉汁不流失；逆纹切口感更嫩。' },
    ];

    const categories = ['东北菜','津菜','川菜','湘菜','鲁菜','韩式料理','日式料理','家常菜','泰式料理','饮品','甜品','主食'];
    let activeCategory = categories[0];
    let cart = JSON.parse(localStorage.getItem('sweetheart-cart') || '{}');
    // 自动迁移：检测旧格式数据（有options的菜用了旧key），清掉重新来
    if (Object.keys(cart).some(k => !k.includes('::') && menuList.find(d => d.id === k)?.options)) {
      cart = {};
      localStorage.removeItem('sweetheart-cart');
      localStorage.removeItem('sweetheart-cart-options');
    }
    const makeKey = (id, opt) => opt ? `${id}::${opt}` : id;
    const dishTotal = (id) => Object.entries(cart).filter(([k])=>k===id||k.startsWith(id+'::')).reduce((s,[,q])=>s+q,0);

    const money = v => '¥' + v.toFixed(0);
    const getDish = id => menuList.find(d => d.id === id);
    const saveCart = () => {
      localStorage.setItem('sweetheart-cart', JSON.stringify(cart));
    };
    const cartEntries = () => Object.entries(cart).filter(([,q])=>q>0).map(([key,q])=>{const [id,opt]=key.split('::');return {dish:getDish(id),quantity:q,option:opt||'',cartKey:key}}).filter(({dish})=>dish);
    const cartCount = () => cartEntries().reduce((s,e)=>s+e.quantity,0);
    const cartTotal = () => cartEntries().reduce((s,e)=>s+e.dish.price*e.quantity,0);

    function changeQuantity(key, delta) {
      cart[key] = Math.max(0, (cart[key]||0)+delta);
      if (!cart[key]) delete cart[key];
      saveCart(); renderMenu(); renderCartBar(); renderCartModal();
    }

    /* ---- 左侧竖栏 ---- */
    function renderSidebar() {
      $('#sidebar').innerHTML = categories.map(c => {
        const a = c === activeCategory;
        return `<button class="w-full text-left rounded-xl px-2 py-3 text-xs font-bold transition-all duration-150 active:scale-95 ${
          a ? 'bg-accent text-prime' : 'text-mute hover:text-tx hover:bg-white/5'
        }" data-cat="${c}">${c}</button>`;
      }).join('');
      document.querySelectorAll('[data-cat]').forEach(b =>
        b.addEventListener('click', () => { activeCategory = b.dataset.cat; renderSidebar(); renderMenu(); })
      );
    }

    /* ---- 菜品卡片 ---- */
    function dishImage(dish, cls) {
      const sz = cls || 'dish-img w-full h-full';
      return `<div class="relative aspect-square rounded-2xl overflow-hidden bg-[#111] border-2 border-white/10 p-2">
        <div class="w-full h-full rounded-xl overflow-hidden bg-[#1a1a1a]">
          <img src="${dish.img}" alt="${dish.name}" class="w-full h-full object-cover"
            onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%231a1a1a%22/%3E%3Ctext x=%22200%22 y=%22230%22 text-anchor=%22middle%22 font-size=%22120%22%3E🍽%3C/text%3E%3C/svg%3E'"></div></div>`;
    }

    function starRating(n) {
      if (n >= 5.0) return '<span class="text-gold text-xs font-bold">★ 夯爆了！</span>';
      const full = Math.floor(n);
      const half = n - full >= 0.5;
      let s = '';
      for (let i=0;i<5;i++) s += i<full ? '★' : (i===full&&half ? '⯪' : '☆');
      return `<span class="text-gold text-xs">${s} ${n.toFixed(1)}</span>`;
    }

    function renderMenu() {
      const dishes = menuList.filter(d => d.category === activeCategory);
      $('#categoryTitle').textContent = activeCategory;
      $('#sumBadge').textContent = 'SUM: ' + dishes.length;

      $('#menuList').innerHTML = dishes.map(dish => `
        <article class="rounded-2xl bg-card border border-white/5 p-3 hover:border-white/10 transition-all duration-200">
          <div class="flex gap-3">
            <button class="shrink-0 w-[120px] active:scale-95 transition-all duration-150" data-detail="${dish.id}">
              ${dishImage(dish)}
            </button>
            <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
              <button class="text-left" data-detail="${dish.id}">
                <h3 class="truncate text-base font-bold text-tx">${dish.name}</h3>
                <p class="mt-1 text-xs leading-5 text-mute line-clamp-2">${dish.desc}</p>
                <div class="flex items-center gap-2 mt-2">
                  ${starRating(dish.taste)}
                  ${dish.taste>=5?'<span class="text-[10px] text-prime bg-prime/10 px-2 py-0.5 rounded font-bold">🔥推荐</span>':''}
                  <span class="text-[10px] text-mute bg-white/5 px-2 py-0.5 rounded">被选 ${(dish.selectedCount||0)} 次</span>
                </div>
              </button>
              <button class="text-left w-fit mt-1 text-xs text-prime/70 border border-prime/30 rounded-lg px-3 py-1 active:scale-95 transition-all" data-detail="${dish.id}">查看做法 →</button>
            </div>
          </div>
          <div class="flex items-center gap-2 mt-3">
            <button class="flex-1 h-11 rounded-xl bg-prime text-ink text-sm font-bold active:scale-95 transition-all duration-150" data-want="${dish.id}">${dish.category==='饮品'?'我要喝这个！':'我要吃这个！'}</button>
            <div class="flex items-center gap-1 shrink-0">
              <button class="w-8 h-8 rounded-full bg-white/5 text-mute text-sm active:scale-95 ${dishTotal(dish.id)?'':'invisible'}" data-minus="${dish.id}">−</button>
              <span class="min-w-[16px] text-center text-xs font-bold ${dishTotal(dish.id)?'':'hidden'}">${dishTotal(dish.id)||0}</span>
              <button class="w-8 h-8 rounded-full bg-prime/30 text-prime text-sm active:scale-95" data-plus="${dish.id}">+</button>
            </div>
          </div>
        </article>`).join('');

      document.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', ()=>{const dish=getDish(b.dataset.plus);if(dish&&dish.options){showOptionPicker(dish)}else{changeQuantity(b.dataset.plus,1)}}));
      document.querySelectorAll('[data-minus]').forEach(b => b.addEventListener('click', ()=>changeQuantity(b.dataset.minus,-1)));
      document.querySelectorAll('[data-detail]').forEach(b => b.addEventListener('click', ()=>openDish(b.dataset.detail)));
      document.querySelectorAll('[data-want]').forEach(b => b.addEventListener('click', ()=>{
        const dish = getDish(b.dataset.want);
        if (dish && dish.options) {
          showOptionPicker(dish);
        } else {
          changeQuantity(b.dataset.want, 1);
          showToast('已加入 · ' + (dish?.name||''));
        }
      }));
    }

    /* ---- 底部悬浮栏 ---- */
    function renderCartBar() {
      const n = cartCount();
      $('#cartBar').innerHTML = `
        <div class="flex items-center gap-2 max-w-[414px] mx-auto">
          <button id="openCart" class="flex-1 flex items-center justify-between h-14 rounded-2xl bg-card border border-white/10 px-4 active:scale-95 transition-all duration-150">
            <span class="flex items-center gap-3">
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-prime/20 text-prime text-sm font-bold">${n}</span>
              <span class="text-sm text-mute">已选 · <strong class="text-gold">${money(cartTotal())}</strong></span>
            </span>
            <span class="text-xs text-mute">展开 ›</span>
          </button>
          <button id="randomPick" class="h-14 rounded-2xl bg-warm/20 text-warm text-xs font-bold px-4 active:scale-95 transition-all duration-150 whitespace-nowrap">
            随便来一碗
          </button>
        </div>`;
      $('#openCart').addEventListener('click', () => { renderCartModal(); $('#cartModal').classList.remove('hidden'); });
      $('#randomPick').addEventListener('click', () => window.rerollRandom());
    }

    let randomDish = null;

    window.rerollRandom = function() {
      const dishes = menuList;
      if (!dishes.length) return;
      randomDish = dishes[Math.floor(Math.random()*dishes.length)];
      renderRandomModal();
    };

    window.confirmRandom = function() {
      if (!randomDish) return;
      $('#randomModal').style.display = 'none';
      if (randomDish.options) {
        showOptionPicker(randomDish);
      } else {
        changeQuantity(randomDish.id, 1);
        showToast('🎲 今天吃「' + randomDish.name + '」吧！');
      }
    };

    window.closeRandom = function() {
      $('#randomModal').style.display = 'none';
    };

    function renderRandomModal() {
      const dish = randomDish;
      $('#randomInner').innerHTML = `
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <p class="text-[10px] pixel-text text-mute uppercase mb-1">Random</p>
              <p class="text-xl font-bold text-tx">就它了？</p>
            </div>
            <button onclick="closeRandom()" class="text-2xl text-mute hover:text-tx px-2 active:scale-95 transition-all">×</button>
          </div>
          <div class="flex justify-center py-4">
            <div class="w-[220px]">${dishImage(dish)}</div>
          </div>
          <p class="text-center text-lg font-bold text-tx mt-3">${dish.name}</p>
          <p class="text-center text-xs text-mute mt-1">${dish.desc}</p>
          <div class="flex gap-3 mt-6">
            <button onclick="rerollRandom()" class="flex-1 h-12 rounded-2xl bg-white/5 border border-white/10 text-tx text-sm font-bold active:scale-95 transition-all duration-150">换一个</button>
            <button onclick="confirmRandom()" class="flex-1 h-12 rounded-2xl bg-prime text-ink text-sm font-bold active:scale-95 transition-all duration-150">就这个！</button>
          </div>
        </div>`;
      $('#randomModal').style.display = 'flex';
    }

    /* ---- 选项弹窗 ---- */
    function showOptionPicker(dish) {
      const opts = dish.options;
      $('#optionInner').innerHTML = `
        <div class="text-center">
          <p class="text-[10px] pixel-text text-mute uppercase mb-2">Option</p>
          <p class="text-xl font-bold text-tx mb-1">${dish.name}</p>
          <p class="text-xs text-mute mb-5">选一个搭配</p>
          ${opts.map(o => `<button class="w-full h-12 rounded-2xl bg-white/5 border border-white/10 text-tx text-sm font-bold mb-2 active:scale-95 hover:border-prime/40 transition-all duration-150" data-opt="${o}" data-dish="${dish.id}">${o}</button>`).join('')}
          <button class="w-full h-10 text-xs text-mute mt-2 active:scale-95" id="cancelOption">取消</button>
        </div>`;
      $('#optionModal').style.display = 'flex';
      document.querySelectorAll('#optionInner [data-opt]').forEach(b =>
        b.addEventListener('click', () => {
          changeQuantity(makeKey(dish.id, b.dataset.opt), 1);
          $('#optionModal').style.display = 'none';
          showToast('已加入 · ' + dish.name + '（' + b.dataset.opt + '）');
        })
      );
      $('#cancelOption').addEventListener('click', () => $('#optionModal').style.display = 'none');
    }

    /* ---- 购物车弹窗 ---- */
    function renderCartModal() {
      const entries = cartEntries();
      $('#emptyCart').classList.toggle('hidden', entries.length>0);
      $('#cartItems').innerHTML = entries.map(({dish,quantity,option,cartKey})=>`
        <div class="flex items-center gap-3 rounded-xl bg-card border border-white/5 p-3">
          <div class="w-14 h-14 shrink-0 rounded-xl overflow-hidden bg-white/5">${dishImage(dish)}</div>
          <div class="min-w-0 flex-1">
            <h3 class="truncate font-bold text-tx text-sm">${dish.name}${option ? ' <span class="text-gold text-xs">'+option+'</span>' : ''}</h3>
            <p class="text-xs text-prime">${money(dish.price)}</p>
          </div>
          <div class="flex items-center gap-1">
            <button class="w-7 h-7 rounded-full bg-white/5 text-mute text-sm active:scale-95" data-minus="${cartKey}">−</button>
            <span class="min-w-[14px] text-center text-xs font-bold">${quantity}</span>
            <button class="w-7 h-7 rounded-full bg-prime/30 text-prime text-sm active:scale-95" data-plus="${cartKey}">+</button>
          </div>
        </div>`).join('');
      $('#cartTotal').textContent = money(cartTotal());
      $('#submitOrder').disabled = !entries.length;
      document.querySelectorAll('#cartItems [data-plus]').forEach(b=>b.addEventListener('click',()=>changeQuantity(b.dataset.plus,1)));
      document.querySelectorAll('#cartItems [data-minus]').forEach(b=>b.addEventListener('click',()=>changeQuantity(b.dataset.minus,-1)));
    }

    /* ---- 菜品详情弹窗 ---- */
    function openDish(id) {
      const dish = getDish(id);
      const steps = dish.steps||[];
      const el = $('#dishModal').querySelector('div');
      el.innerHTML = `
        <div class="relative">
          <div class="aspect-square bg-panel overflow-hidden border-b border-white/5 p-6 pt-10 pb-6 flex items-center justify-center">
            <div class="w-full max-w-[300px]">${dishImage(dish)}</div>
          </div>
          <button id="closeDish" class="absolute top-4 left-4 w-10 h-10 rounded-full bg-ink/70 text-tx text-xl flex items-center justify-center active:scale-95 transition-all">×</button>
        </div>
        <div class="p-5">
          <p class="text-[10px] pixel-text text-mute uppercase tracking-wider mb-1">Taste</p>
          <h2 class="text-2xl font-bold text-tx">${dish.name}</h2>
          <div class="flex items-center gap-3 mt-2">
            ${starRating(dish.taste)}
            <span class="text-xs text-mute">被选择 ${dish.selectedCount||0}</span>
          </div>
          <p class="mt-4 text-sm leading-7 text-mute">${dish.detail}</p>
          <div class="mt-4 rounded-2xl bg-card border border-white/5 p-4">
            <p class="text-[10px] pixel-text text-mute mb-2">Ingredients</p>
            <h3 class="font-bold text-tx text-sm">食材准备</h3>
            <p class="mt-2 text-sm text-mute leading-6">${dish.ingredients}</p>
          </div>
          <div class="mt-3 rounded-2xl bg-accent/20 border border-accent/20 p-4">
            <h3 class="font-bold text-prime text-sm">碳蛋脂比例</h3>
            <p class="mt-2 text-sm text-tx/70">${dish.nutrition}</p>
          </div>
          ${steps.length ? `
          <div class="mt-4 rounded-2xl bg-card border border-white/5 p-4">
            <p class="text-[10px] pixel-text text-mute mb-2">Tutorial</p>
            <h3 class="font-bold text-tx text-sm">做法步骤</h3>
            <div class="mt-3 space-y-3">
              ${steps.map((s,i)=>`<div class="flex gap-3"><span class="w-6 h-6 shrink-0 rounded-full bg-prime/20 text-prime text-xs flex items-center justify-center font-bold">${i+1}</span><p class="text-sm text-mute leading-6">${s}</p></div>`).join('')}
            </div>
          </div>`:''}
          ${dish.tips ? `
          <div class="mt-4 rounded-2xl bg-warm/10 border border-warm/10 p-4">
            <p class="text-sm text-warm"><span class="font-bold">AB提示：</span>${dish.tips}</p>
          </div>`:''}
          <button id="detailAdd" class="mt-6 w-full h-14 rounded-2xl bg-prime text-ink text-base font-bold active:scale-95 transition-all duration-150">
            ${dish.category==='饮品'?'我要喝这个！':'我要吃这个！'} · ${dishTotal(dish.id)||0} 份
          </button>
        </div>`;
      $('#dishModal').classList.remove('hidden');
      $('#closeDish').addEventListener('click', closeDish);
      $('#detailAdd').addEventListener('click',()=>{
        if (dish.options) {
          closeDish();
          showOptionPicker(dish);
        } else {
          changeQuantity(dish.id,1);
          $('#detailAdd').textContent = '我要吃这个！ · '+(dishTotal(dish.id)||0)+' 份';
        }
      });
    }

    function closeDish() { $('#dishModal').classList.add('hidden'); }

    /* ---- Toast ---- */
    function showToast(msg) {
      const t = $('#dishToast'); t.textContent = msg; t.classList.remove('hidden');
      clearTimeout(showToast.timer); showToast.timer = setTimeout(()=>t.classList.add('hidden'),2600);
    }

    /* ---- 订单提交 ---- */
    function genOrderId() {
      const now = new Date(), pad = n=>String(n).padStart(2,'0');
      const rand = Math.random().toString(36).slice(2,6).toUpperCase();
      return 'OD-'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds())+'-'+rand;
    }

    function orderText() {
      const note = $('#orderNote').value.trim();
      return ['【专属点餐】',...cartEntries().map(({dish,quantity,option})=>dish.name+(option?'【'+option+'】':'')+' × '+quantity),'合计：'+money(cartTotal()),note?'备注：'+note:''].filter(Boolean).join('\n');
    }

    async function submitOrder() {
      const entries = cartEntries(); if (!entries.length) return;
      const btn = $('#submitOrder'); btn.disabled = true; btn.textContent = '正在送出爱心…';
      const orderId = genOrderId();
      const payload = { orderId, items: entries.map(({dish,quantity,option})=>({id:dish.id,name:dish.name,price:dish.price,quantity,option:option||''})), total: cartTotal(), note: $('#orderNote').value.trim(), clientTime: new Date().toISOString() };
      try {
        const res = await fetch('/api/submit-order', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok || data.code!==0) throw new Error(data.msg||'提交失败');
        cart = {}; saveCart(); $('#orderNote').value = ''; $('#cartModal').classList.add('hidden');
        renderMenu(); renderCartBar();
        const feishu = data.feishu;
        showToast('订单提交成功，等你开饭啦 ♡'+(feishu?(feishu.ok?' ✅飞书通知已发送':' ⚠️飞书:'+feishu.error):''));
      } catch(err) {
        try { await navigator.clipboard.writeText(orderText()); showToast('网络不太稳定，订单已复制，请手动发送'); }
        catch { showToast('提交失败，请截图或手动记录订单'); }
      } finally { btn.disabled=!cartEntries().length; btn.textContent='提交订单 · 让爱送达'; }
    }

    // 事件绑定
    $('#closeCart').addEventListener('click', ()=>$('#cartModal').classList.add('hidden'));
    $('#backToMenu').addEventListener('click', ()=>$('#cartModal').classList.add('hidden'));
    $('#clearCart').addEventListener('click', ()=>{
      if (!cartEntries().length) return; cart={}; saveCart(); renderMenu(); renderCartBar(); renderCartModal(); showToast('购物车已清空');
    });
    $('#submitOrder').addEventListener('click', submitOrder);

    /* ---- 订单历史 ---- */
    let ordersTab = 'today';
    async function loadOrders() {
      $('#ordersContent').innerHTML = '<p class="text-center text-mute py-20">加载中…</p>';
      try {
        const res = await fetch('/api/get-orders?type='+ordersTab);
        const data = await res.json();
        const orders = data.orders||[];
        if (!orders.length) {
          $('#ordersContent').innerHTML = '<div class="py-20 text-center"><div class="text-5xl">🍽️</div><p class="mt-3 text-mute">'+(ordersTab==='today'?'今天还没有订单':'还没有订单记录')+'</p></div>';
          return;
        }
        $('#ordersContent').innerHTML = orders.map(o=>`
          <div class="mb-3 rounded-2xl bg-card border border-white/5 p-4 relative group">
            <button class="absolute top-3 right-3 w-7 h-7 flex items-center justify-center rounded-full text-mute/40 text-sm active:scale-95 hover:text-danger hover:bg-danger/10 transition-all" data-del="${o.orderId}">×</button>
            <div class="flex items-center justify-between mb-2 pr-8">
              <span class="text-xs text-mute">${(o.clientTime||o.serverTime||'').slice(0,16).replace('T',' ')}</span>
              <span class="text-xs text-gold font-bold">${o.orderId||''}</span>
            </div>
            <div class="space-y-1">${(o.items||[]).map(it=>`<div class="flex justify-between text-sm"><span class="text-tx">${it.name} × ${it.quantity}</span><span class="text-prime">¥${(it.price*it.quantity).toFixed(0)}</span></div>`).join('')}</div>
            ${o.note?`<p class="mt-2 text-xs text-mute">💬 ${o.note}</p>`:''}
          </div>`).join('');
      } catch(e) { $('#ordersContent').innerHTML = '<p class="text-center text-mute py-20">加载失败，请重试</p>'; }
    }

    async function deleteOrder(orderId) {
      try { await fetch('/api/delete-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId})}); } catch(e) {}
      loadOrders();
    }

    $('#ordersBtn').addEventListener('click',()=>{
      ordersTab='today'; $('#tabToday').className='rounded-full px-4 py-2 text-sm font-bold transition-all active:scale-95 bg-prime text-ink'; $('#tabAll').className='rounded-full px-4 py-2 text-sm font-bold transition-all active:scale-95 bg-white/5 text-mute'; $('#ordersModal').classList.remove('hidden'); loadOrders();
    });
    $('#closeOrdersModal').addEventListener('click',()=>$('#ordersModal').classList.add('hidden'));
    $('#tabToday').addEventListener('click',()=>{ ordersTab='today'; $('#tabToday').className='rounded-full px-4 py-2 text-sm font-bold transition-all active:scale-95 bg-prime text-ink'; $('#tabAll').className='rounded-full px-4 py-2 text-sm font-bold transition-all active:scale-95 bg-white/5 text-mute'; loadOrders(); });
    $('#tabAll').addEventListener('click',()=>{ ordersTab='all'; $('#tabAll').className='rounded-full px-4 py-2 text-sm font-bold transition-all active:scale-95 bg-prime text-ink'; $('#tabToday').className='rounded-full px-4 py-2 text-sm font-bold transition-all active:scale-95 bg-white/5 text-mute'; loadOrders(); });
    $('#ordersContent').addEventListener('click',e=>{ const btn=e.target.closest('[data-del]'); if(btn) deleteOrder(btn.dataset.del); });

    // 首页时钟 + 动态背景
    function updateHomeClock() {
      const now = new Date();
      const h = now.getHours();
      const pad = n => String(n).padStart(2,'0');
      $('#homeClock').textContent = pad(h) + ':' + pad(now.getMinutes());
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      $('#homeDate').textContent = days[now.getDay()] + '  ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
      $('#homePeriod').textContent = h < 6 ? '凌晨' : h < 12 ? '上午' : h < 18 ? '下午' : '晚上';

      // 动态主题色
      let themeBg, themeCard, themeAccent, themePrime;
      if (h >= 6 && h < 12) {
        themeBg = '#0a1218'; themeCard = '#121a22'; themeAccent = '#1a2a3a'; themePrime = '#8ab4f8';
      } else if (h >= 12 && h < 17) {
        themeBg = '#0a1008'; themeCard = '#141a10'; themeAccent = '#2a3a1a'; themePrime = '#c9a96e';
      } else if (h >= 17 && h < 20) {
        themeBg = '#100808'; themeCard = '#1a1010'; themeAccent = '#3a1a1a'; themePrime = '#e8a088';
      } else {
        themeBg = '#0a0a0a'; themeCard = '#1a1a1a'; themeAccent = '#2a2a4a'; themePrime = '#8ab4f8';
      }
      let style = document.getElementById('dynamic-theme');
      if (!style) { style = document.createElement('style'); style.id = 'dynamic-theme'; document.head.appendChild(style); }
      style.textContent = `
        .bg-ink{background-color:${themeBg}!important}
        .bg-card{background-color:${themeCard}!important}
        .bg-accent\\/20{background-color:${themeAccent}33!important}
        .bg-accent\\/40{background-color:${themeAccent}66!important}
        .bg-panel{background-color:${themeBg}!important}
        .bg-prime{background-color:${themePrime}!important}
        .bg-prime\\/20{background-color:${themePrime}33!important}
        .bg-prime\\/30{background-color:${themePrime}4d!important}
        .text-prime{color:${themePrime}!important}
        .border-prime\\/40{border-color:${themePrime}66!important}
        .border-accent\\/20{border-color:${themeAccent}33!important}
      `;

      // 动态背景
      const hp = $('#homePage');
      const sun = hp.querySelector('[data-sky]');
      const ground = hp.querySelector('[data-ground]');
      if (h >= 6 && h < 12) {
        // 早晨：淡蓝天空 + 浅黄太阳
        sun.style.background = 'linear-gradient(180deg, #2a4a6a 0%, #3a5a7a 30%, #4a6a8a 55%, #3a5560 75%, #1a2a30 100%)';
        ground.style.background = 'linear-gradient(180deg,transparent 0%,#1a2530 30%,#152020 60%,#0a0a0a 100%)';
      } else if (h >= 12 && h < 17) {
        // 下午：暖色调 + 金色太阳
        sun.style.background = 'linear-gradient(180deg, #3a5a6a 0%, #4a6a5a 30%, #5a6040 55%, #3a4030 75%, #1a2010 100%)';
        ground.style.background = 'linear-gradient(180deg,transparent 0%,#1a2015 30%,#151810 60%,#0a0a0a 100%)';
      } else if (h >= 17 && h < 20) {
        // 傍晚：橙红天空
        sun.style.background = 'linear-gradient(180deg, #5a3a2a 0%, #4a2a1a 30%, #3a1a10 55%, #1a1010 75%, #0a0a0a 100%)';
        ground.style.background = 'linear-gradient(180deg,transparent 0%,#150d0a 30%,#100808 60%,#0a0a0a 100%)';
      } else {
        // 夜晚：深蓝黑
        sun.style.background = 'linear-gradient(180deg, #0a1520 0%, #0a1018 30%, #080d15 55%, #060a10 75%, #0a0a0a 100%)';
        ground.style.background = 'linear-gradient(180deg,transparent 0%,#0a0d12 30%,#080a0d 60%,#0a0a0a 100%)';
      }
    }
    updateHomeClock();
    setInterval(updateHomeClock, 30000);

    // 启动
    function enterMenu(cat) {
      $('#homePage').style.display = 'none';
      document.querySelector('header').style.display = '';
      document.querySelector('main').style.display = '';
      $('#cartBar').style.display = '';
      if (cat) activeCategory = cat;
      initMenu();
    }

    function goHome() {
      $('#homePage').style.display = '';
      document.querySelector('header').style.display = 'none';
      document.querySelector('main').style.display = 'none';
      $('#cartBar').style.display = 'none';
    }

    // 首页进入按钮
    $('#enterBtn').addEventListener('click', () => enterMenu());
    $('#drinkBtn').addEventListener('click', () => enterMenu('饮品'));
    $('#homeBtn').addEventListener('click', goHome);

    function initMenu() {
      renderSidebar(); renderMenu(); renderCartBar();
      // 从历史订单统计被选次数
      fetchOrderCounts();
    }

    async function fetchOrderCounts() {
      try {
        const res = await fetch('/api/get-orders?type=all');
        const data = await res.json();
        const orders = data.orders || [];
        const counts = {};
        orders.forEach(o => (o.items||[]).forEach(it => {
          if (it.id) counts[it.id] = (counts[it.id]||0) + (it.quantity||0);
        }));
        menuList.forEach(d => d.selectedCount = counts[d.id] || 0);
        // 菜单已渲染则重绘
        if (document.querySelector('main')?.style?.display !== 'none') {
          renderMenu();
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
